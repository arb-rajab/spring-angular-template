<div class="page auth-page">
  <div class="card auth-card">
    <h1>Sign in</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field label="Email" inputId="email" [control]="form.controls.email">
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </app-form-field>
      <app-form-field label="Password" inputId="password" [control]="form.controls.password">
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </app-form-field>

      @if (errorMessage()) {
        <app-alert variant="error">{{ errorMessage() }}</app-alert>
      }

      <app-button type="submit" class="block" [loading]="submitting()">Sign in</app-button>
    </form>

    <div class="divider"><span>or</span></div>

    <app-button variant="secondary" class="block" (click)="signInWithSso()">Sign in with SSO</app-button>

    <p class="muted">No account? <a routerLink="/register">Register</a></p>
  </div>
</div>
