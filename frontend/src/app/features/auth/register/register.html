<div class="page auth-page">
  <div class="card auth-card">
    <h1>Create an account</h1>
    <p class="muted">New accounts start with the User role. An administrator can grant more later.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field label="First name" inputId="firstName" [control]="form.controls.firstName" [errors]="fieldErrors()['firstName']">
        <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" />
      </app-form-field>
      <app-form-field label="Last name" inputId="lastName" [control]="form.controls.lastName" [errors]="fieldErrors()['lastName']">
        <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" />
      </app-form-field>
      <app-form-field label="Email" inputId="email" [control]="form.controls.email" [errors]="fieldErrors()['email']">
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </app-form-field>
      <app-form-field
        label="Password"
        inputId="password"
        hint="At least 8 characters."
        [control]="form.controls.password"
        [errors]="fieldErrors()['password']"
      >
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      </app-form-field>

      @if (errorMessage()) {
        <app-alert variant="error">{{ errorMessage() }}</app-alert>
      }

      <app-button type="submit" class="block" [loading]="submitting()">Create account</app-button>
    </form>

    <p class="muted">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
