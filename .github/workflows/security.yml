name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new advisories surface even when the repo is quiet.
    - cron: '23 4 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # osv-scanner's own pom.xml resolver cannot handle Spring Boot BOM-managed versions, so let
      # Maven resolve the real dependency tree and hand osv-scanner an SBOM instead.
      - name: Generate backend SBOM
        working-directory: backend
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom

      # Scans the backend SBOM and the frontend lockfile against the OSV database. Exceptions
      # are dated entries in osv-scanner.toml.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --sbom=backend/target/bom.json
            --lockfile=frontend/package-lock.json
