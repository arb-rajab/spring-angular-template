name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so past commits are scanned too
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (build, test, lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Docker Hub images through mirror.gcr.io
        # Docker Hub rate-limits anonymous pulls and has outages. As a daemon
        # registry mirror, mirror.gcr.io (Google's cache of popular Docker
        # Hub images) is tried first and Docker Hub is the fallback on a
        # cache miss. registry-mirrors is reloadable, so SIGHUP applies it
        # without stopping service containers.
        run: |
          sudo sh -c '[ -s /etc/docker/daemon.json ] || echo "{}" > /etc/docker/daemon.json'
          sudo cat /etc/docker/daemon.json \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo cp "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl reload docker
          for _ in $(seq 1 15); do
            docker info --format '{{.RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io && exit 0
            sleep 1
          done
          echo "::error::Docker did not pick up the registry mirror"
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `mvn verify` runs, in order: compile, Surefire unit tests (*Test.java), Failsafe
      # integration tests (*IT.java, which start a real Postgres and Keycloak through
      # Testcontainers, so Docker must be available on the runner), and the Spotless format check.
      - name: Build, unit and integration tests, format check
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Set up Chrome for headless tests
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Unit tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessCI --karma-config=karma.conf.js

      - name: Production build
        run: npx ng build --configuration production

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pulls Dockerfile base images itself, not through the Docker
          # daemon: mirror.gcr.io first, Docker Hub on a cache miss.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          tags: project-name-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          tags: project-name-frontend:ci

  dependency-review:
    name: Dependency review (PR diff)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
