spring:
  application:
    name: project-name
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_name}
    username: ${DB_USERNAME:project_name}
    password: ${DB_PASSWORD:project_name}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:project-name-backend}
            client-secret: ${OIDC_CLIENT_SECRET:project-name-dev-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            client-name: ProjectName SSO (Keycloak)
        provider:
          keycloak:
            # Deliberately NOT `issuer-uri`: that forces one origin for every endpoint, which
            # breaks when the browser and the backend cannot reach Keycloak by the same hostname
            # (the docker-compose case, where the browser only knows `localhost:8180` and the
            # backend only knows the `keycloak` service name). Naming each endpoint lets
            # docker-compose.yml override just the backend-internal ones.
            authorization-uri: ${OIDC_AUTHORIZATION_URI:http://localhost:8180/realms/project-name/protocol/openid-connect/auth}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/project-name/protocol/openid-connect/token}
            jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/project-name/protocol/openid-connect/certs}
            user-info-uri: ${OIDC_USERINFO_URI:http://localhost:8180/realms/project-name/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
      issuer: project-name
  oidc:
    frontend-redirect-uri: ${OIDC_FRONTEND_REDIRECT_URI:http://localhost:4200/sso/callback}
  rate-limit:
    # In-memory token buckets: up to `capacity` requests per `period-minutes`, per key.
    login-per-credential:
      capacity: ${RATE_LIMIT_LOGIN_PER_CREDENTIAL_CAPACITY:20}
      period-minutes: ${RATE_LIMIT_LOGIN_PER_CREDENTIAL_PERIOD_MINUTES:1}
    login-per-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP_CAPACITY:60}
      period-minutes: ${RATE_LIMIT_LOGIN_PER_IP_PERIOD_MINUTES:1}
    api-per-ip:
      capacity: ${RATE_LIMIT_API_PER_IP_CAPACITY:1200}
      period-minutes: ${RATE_LIMIT_API_PER_IP_PERIOD_MINUTES:1}
    # CIDR blocks of reverse proxies allowed to supply X-Forwarded-For/X-Real-IP. Empty by
    # default (no proxy trusted, plain getRemoteAddr() is used) so local runs with no proxy in
    # front of the app are unaffected; docker-compose.yml sets it to the frontend (nginx)
    # container's fixed address.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
